version: "3.9"

networks:
  cluster_net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.30.0.0/16

services:
  taskand-node1:
    build:
      context: ../..
      dockerfile: tests/docker/Dockerfile.cluster
    container_name: taskand-node1
    hostname: taskand-node1
    networks:
      cluster_net:
        ipv4_address: 172.30.0.11
    ports:
      - "8071:8077"
      - "2221:22"
    volumes:
      - ${TASKAND_SOURCE_DIR:-../../taskand}:/opt/taskand-template:ro
      - node1_data:/opt/taskand
    environment:
      - TASKAND_NODE=node1
      - TASKAND_BIND=0.0.0.0
      - TASKAND_AUTH_TOKEN=test-cluster-auth-token
      - AUTO_START_GATEWAY=1

  taskand-node2:
    build:
      context: ../..
      dockerfile: tests/docker/Dockerfile.cluster
    container_name: taskand-node2
    hostname: taskand-node2
    networks:
      cluster_net:
        ipv4_address: 172.30.0.12
    ports:
      - "8072:8077"
      - "2222:22"
    volumes:
      - ${TASKAND_SOURCE_DIR:-../../taskand}:/opt/taskand-template:ro
      - node2_data:/opt/taskand
    environment:
      - TASKAND_NODE=node2
      - TASKAND_BIND=0.0.0.0
      - TASKAND_AUTH_TOKEN=test-cluster-auth-token
      - AUTO_START_GATEWAY=1

  taskand-node3:
    build:
      context: ../..
      dockerfile: tests/docker/Dockerfile.cluster
    container_name: taskand-node3
    hostname: taskand-node3
    networks:
      cluster_net:
        ipv4_address: 172.30.0.13
    ports:
      - "8073:8077"
      - "2223:22"
    volumes:
      - ${TASKAND_SOURCE_DIR:-../../taskand}:/opt/taskand-template:ro
      - node3_data:/opt/taskand
    environment:
      - TASKAND_NODE=node3
      - TASKAND_BIND=0.0.0.0
      - TASKAND_AUTH_TOKEN=test-cluster-auth-token
      - AUTO_START_GATEWAY=1

volumes:
  node1_data:
  node2_data:
  node3_data:
