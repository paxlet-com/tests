x-runtime: &runtime
  image: ${CLUSTER_IMAGE:?Use run_cluster_test.sh}
  build:
    context: ${AUTONOMY_BUILD_CONTEXT:?Use run_cluster_test.sh}
    dockerfile: tests/docker/Dockerfile.e2e
  read_only: true
  user: "65534:65534"
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  mem_limit: 768m
  cpus: 1.0
  tmpfs:
    - /tmp:rw,nosuid,nodev,size=256m,mode=1777
  networks: [cluster]
  init: true

services:
  node-a:
    <<: *runtime
    hostname: node-a
    command: [tests/cluster_runtime.py, serve]
    environment: {CLUSTER_NODE: a, HOME: /tmp}
  node-b:
    <<: *runtime
    hostname: node-b
    command: [tests/cluster_runtime.py, serve]
    environment: {CLUSTER_NODE: b, HOME: /tmp}
  node-c:
    <<: *runtime
    hostname: node-c
    command: [tests/cluster_runtime.py, serve]
    environment: {CLUSTER_NODE: c, CLUSTER_AUTO_APPROVE: "1", HOME: /tmp}
  runner:
    <<: *runtime
    command: [tests/test_cluster_replication.py]
    environment: {CLUSTER_TEST_RUN: "1", HOME: /tmp}

networks:
  cluster:
    internal: true
