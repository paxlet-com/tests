services:
  autonomy-e2e-runner:
    build:
      context: ${AUTONOMY_BUILD_CONTEXT:?Use tests/run_e2e.sh docker to stage source inputs}
      dockerfile: tests/docker/Dockerfile.e2e
    network_mode: none
    read_only: true
    user: "65534:65534"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 768m
    cpus: 1.0
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=128m,mode=1777
    environment:
      TASKAND_ROOT: /workspace/taskand
      TASKAND_SHELL_PYTHON: /usr/local/bin/python
      TASKAND_GATEWAY: http://127.0.0.1:9
      PYTHONDONTWRITEBYTECODE: "1"
      HOME: /tmp
